[package]
name = "pdf-to-txt"
version = "1.0.15"
description = "Desktop app and CLI to extract text from PDF files into .txt"
authors = ["Taylor Ivanoff"]
edition = "2021"

[lib]
name = "pdf_to_txt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-tray-base = { path = "../../tauri-tray-base" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
which = "7"
