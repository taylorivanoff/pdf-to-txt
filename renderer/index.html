<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF to TXT</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="app" id="app">
    <header class="titlebar">
      <div class="titlebar-drag">
        <h1 class="app-title">PDF to TXT</h1>
      </div>
      <div class="titlebar-actions">
        <button type="button" class="text-btn" id="btn-settings">Settings</button>
      </div>
    </header>

    <main class="workspace drop-target" id="workspace">
      <div class="toolbar">
        <button type="button" class="text-btn" id="btn-add-files">Add PDFs…</button>
        <button type="button" class="text-btn" id="btn-add-folder">Add folder…</button>
        <button type="button" class="text-btn" id="btn-clear" disabled>Clear</button>
        <div class="spacer"></div>
        <button type="button" class="text-btn" id="btn-pick-out">Output…</button>
        <button type="button" class="text-btn primary" id="btn-convert" disabled>Convert</button>
        <button type="button" class="text-btn danger hidden" id="btn-cancel">Cancel</button>
      </div>

      <p class="meta" id="out-label"></p>

      <div class="split">
        <section class="panel">
          <header class="panel-header">
            <h2 id="queue-label">Queue</h2>
          </header>
          <div class="list" id="queue"></div>
        </section>

        <section class="panel">
          <header class="panel-header">
            <h2>Preview</h2>
            <button type="button" class="text-btn" id="btn-reveal" disabled>Reveal</button>
          </header>
          <pre class="preview" id="preview">Select a PDF to preview extracted text.</pre>
        </section>
      </div>
    </main>

    <p class="hint" id="hint">Drop PDFs or a folder here. Text-layer extraction only - no OCR.</p>
  </div>

  <div class="overlay hidden" id="settings-overlay" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="sheet compact">
      <header class="sheet-header">
        <h2 id="settings-title">Settings</h2>
        <button type="button" class="text-btn" id="settings-close">Close</button>
      </header>

      <label class="toggle-row">
        <span>Always on top</span>
        <input type="checkbox" id="setting-aot" />
      </label>
      <label class="toggle-row">
        <span>Start minimised</span>
        <input type="checkbox" id="setting-minimised" />
      </label>
      <label class="toggle-row">
        <span>Open output folder when done</span>
        <input type="checkbox" id="setting-open-done" />
      </label>
      <label class="field">
        <span>Transparency</span>
        <input type="range" id="setting-opacity" min="0" max="65" step="1" />
        <output id="setting-opacity-out">6%</output>
      </label>
      <p class="meta" id="settings-meta"></p>
    </div>
  </div>

  <div class="toast hidden" id="toast" role="status"></div>
  <script src="vendor/tauri-tray-bridge.js"></script>
  <script src="preload-bridge.js"></script>
  <script src="app.js"></script>
</body>

</html>
